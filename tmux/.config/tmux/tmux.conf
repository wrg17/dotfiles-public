# ============================================================================
# BASICS
# ============================================================================
set  -g  mouse on
set  -g  history-limit 50000
set  -g  default-terminal "tmux-256color"
set  -sg escape-time 0
set  -g  focus-events on
set  -ga terminal-features 'tmux-256color:RGB'

# Use 1-based indexing for windows and panes (matches keyboard layout)
set  -g  base-index 1
setw -g  pane-base-index 1
set  -g  renumber-windows on

# ============================================================================
# PREFIX
# ============================================================================
unbind C-b
set -g prefix C-a
bind  C-a send-prefix

# ============================================================================
# SPLITS — open in current dir, vim-style keys
# ============================================================================
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window      -c "#{pane_current_path}"
unbind '"'
unbind %

# ============================================================================
# NAVIGATION
# ============================================================================
# Pane navigation (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing (repeatable: hold prefix, repeat the resize key)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window navigation
bind -n M-h previous-window
bind -n M-l next-window

# ============================================================================
# COPY MODE — vim-style selection and yank to system clipboard
# ============================================================================
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"

# ============================================================================
# RELOAD
# ============================================================================
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux reloaded"

# ============================================================================
# VISUALS
# ============================================================================
set -g status-position bottom
set -g status-style "fg=white,bg=default"
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=brightcyan"

# Status bar content
set -g status-left  "#[fg=cyan,bold] #S "
set -g status-right "#[fg=brightblack]#H #[fg=cyan]%H:%M "
set -g status-left-length  40
set -g status-right-length 40

# Window status
set -g window-status-current-style "fg=black,bg=cyan,bold"
set -g window-status-format         " #I:#W "
set -g window-status-current-format " #I:#W "
