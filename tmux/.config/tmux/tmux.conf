# ============================================================================
# BASICS
# ============================================================================
set  -g  mouse on
set  -g  history-limit 50000
set  -g  default-terminal "xterm-256color"
set  -sg escape-time 10
set  -g  focus-events on
set  -ga terminal-features   'xterm-256color:RGB'
set  -as terminal-overrides  ',*:Smulx=\E[4::%p1%dm'
set  -as terminal-overrides  ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Use 1-based indexing for windows and panes (matches keyboard layout)
set  -g  base-index 1
setw -g  pane-base-index 1
set  -g  renumber-windows on

# ============================================================================
# PREFIX
# ============================================================================
unbind C-b
set -g prefix C-a
bind  C-a send-prefix

# ============================================================================
# SPLITS — open in current dir, vim-style keys
# ============================================================================
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window      -c "#{pane_current_path}"
unbind '"'
unbind %

# ============================================================================
# NAVIGATION
# ============================================================================
# Pane navigation (vim-style)
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Pane resizing (repeatable: hold prefix, repeat the resize key)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window navigation
bind -n M-h previous-window
bind -n M-l next-window

# ============================================================================
# COPY MODE — vim-style selection and yank to system clipboard
# ============================================================================
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
if-shell "uname | grep -q Darwin" {
    bind-key -T copy-mode-vi y              send-keys -X copy-pipe-and-cancel "pbcopy"
    bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
} {
    bind-key -T copy-mode-vi y              send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
    bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
}

# ============================================================================
# RELOAD
# ============================================================================
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux reloaded"

# ============================================================================
# VISUALS — Dracula via dracula/tmux (TPM)
# ============================================================================
set -g status-position bottom

# Auto-install TPM on first tmux launch
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# TPM plugins (resurrect must precede continuum)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'dracula/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-sessionist'

# Dracula configuration — pick what shows on the right side
set -g @dracula-plugins "git time"
set -g @dracula-show-powerline true
set -g @dracula-show-flags true
set -g @dracula-show-left-icon session
set -g @dracula-military-time true
set -g @dracula-refresh-rate 5

# Resurrect: save pane scrollback contents alongside layout
set -g @resurrect-capture-pane-contents 'on'

# Continuum: auto-restore the last saved session on tmux start
set -g @continuum-restore 'on'

# Initialize TPM — keep this line at the very bottom of tmux.conf
run '~/.tmux/plugins/tpm/tpm'

# Pane border emphasis (applied after TPM so it overrides Dracula defaults)
set -g pane-border-lines heavy
set -g pane-border-indicators colour
set -g pane-border-style       "fg=#44475a"
set -g pane-active-border-style "fg=#ff79c6,bold"
