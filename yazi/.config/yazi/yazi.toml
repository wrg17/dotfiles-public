[mgr]
ratio          = [1, 2, 4]
sort_by        = "natural"
sort_dir_first = true
show_hidden    = true
show_symlink   = true

[preview]
tab_size         = 2
max_width        = 1200
max_height       = 900
image_filter     = "lanczos3"
image_quality    = 90

[opener]
edit = [{ run = 'nvim %s', block = true }]
pycharm = [{ run = 'pycharm %s', orphan = true, desc = "Open in PyCharm" }]
clion = [{ run = 'clion %s', orphan = true, desc = "Open in Clion" }]
open = [{ run = 'xdg-open %s' }]

[open]
rules = [
  { mime = "text/*",                    use = "edit" },
  { mime = "application/json",          use = "edit" },
  { mime = "application/toml",          use = "edit" },
  { mime = "application/yaml",          use = "edit" },
  { mime = "inode/x-empty",             use = "edit" },
  { mime = "image/*",                   use = "open" },
  { mime = "video/*",                   use = "open" },
  { mime = "application/pdf",           use = "open" },
  { mime = "*",                         use = [ "open", "edit", "pycharm", "clion" ] },
]

[plugin]
prepend_fetchers = [
  { id = "git", group = "git", url = "*",  run = "git" },
]
